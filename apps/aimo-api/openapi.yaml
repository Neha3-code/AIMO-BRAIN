openapi: 3.0.3
info:
  title: Valio Aimo Trusted Trade Interface
  version: 1.1.0
  description: >
    The interface Valio Aimo exposes so an authorized, external purchasing
    agent can look up products, get a binding quote, place an order, and
    know when a human has to sign off. Live price and availability are
    proxied from Valio Aimo's real Junction26 mock backend
    (junction26.valioaimo.fi); everything else (catalog facts, substitution
    graph, allergen disclosure, approval guardrail, audit trail) is this
    service's own layer on top.
servers:
  - url: /v1
security:
  - ApiKeyAuth: []
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  schemas:
    TrustEnvelope:
      type: object
      properties:
        claim:
          type: object
          properties:
            product_id: { type: string }
            price:
              type: object
              nullable: true
              properties:
                amount: { type: number }
                currency: { type: string }
                unit: { type: string }
            availability:
              type: object
              properties:
                status: { type: string, enum: [in_stock, out_of_stock, unknown, terminal_supplier] }
                quantity: { type: number, nullable: true }
        provenance:
          type: object
          properties:
            issuer: { type: string, enum: [Valio Aimo] }
            source_system: { type: string }
            observed_at: { type: string, format: date-time }
        validity:
          type: object
          properties:
            expires_at: { type: string, format: date-time }
        verification:
          type: object
          properties:
            status: { type: string, enum: [mock_verified] }
            reference_id: { type: string }
    RecipeComposition:
      type: object
      description: Declared nutritional composition per 100 g (or 100 ml), from the product's GS1/Synkka data. Any value may be null.
      properties:
        fat_g: { type: number, nullable: true }
        protein_g: { type: number, nullable: true }
        carbohydrate_g: { type: number, nullable: true }
        sugar_g: { type: number, nullable: true }
        salt_g: { type: number, nullable: true }
        lactose_g: { type: number, nullable: true }
    ProductFacts:
      type: object
      description: >
        Static facts disclosed on every quote line and alternative. Disclosed,
        never used by Aimo to filter — what counts as too much carbon or a
        broken recipe is the buyer's decision.
      properties:
        category: { type: string, nullable: true }
        carbon_footprint_kg_co2e_per_kg: { type: number, nullable: true, description: Average kg CO2-eq per kg of product }
        delivery_reliability: { type: number, nullable: true, description: "Historical share of deliveries delivered as promised (0–1); null = no history" }
        net_weight_kg_per_sales_unit: { type: number, nullable: true }
        composition: { $ref: "#/components/schemas/RecipeComposition" }
paths:
  /v1/products:
    get:
      summary: Structured, informational product lookup
      parameters:
        - in: query
          name: query
          schema: { type: string }
        - in: query
          name: category
          schema: { type: string }
        - in: query
          name: max_price
          schema: { type: number }
      responses:
        "200":
          description: Catalog facts (incl. carbon footprint, delivery reliability, composition) plus a live trust envelope per result
  /v1/products/{id}/substitutes:
    get:
      summary: A product's registered substitutes, ranked and fully disclosed, ahead of any stock-out
      description: >
        Lets a buyer agent pre-qualify a backup (e.g. on recipe chemistry)
        before the original runs out. Ranked by Aimo's own commercial
        attributes only: available first, then historical delivery
        reliability, then price. Every alternative carries allergens and
        ProductFacts.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: query
          name: requested_date
          schema: { type: string, format: date }
      responses:
        "200": { description: "Original product facts + trust envelope, ranked alternatives, and the ranking basis" }
        "404": { description: Unknown product }
  /v1/quote:
    post:
      summary: Request a locked, expiring, immutable offer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [buyer_id, lines]
              properties:
                buyer_id: { type: string }
                lines:
                  type: array
                  items:
                    type: object
                    properties:
                      product_id: { type: string }
                      qty: { type: number }
      responses:
        "200":
          description: >
            Quote. Every line carries `facts` (ProductFacts). Unavailable lines
            carry ranked alternatives (available first, then delivery
            reliability, then price), each with allergens and `facts`.
  /v1/quote/{id}:
    get:
      summary: Retrieve a previously issued quote and its current status
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: Quote }
        "404": { description: Not found }
  /v1/orders:
    post:
      summary: Commit a quote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quote_id]
              properties:
                quote_id: { type: string }
      responses:
        "200": { description: Order (confirmed or held_for_approval) }
        "409": { description: Quote expired or already consumed }
  /v1/orders/{id}:
    get:
      summary: Current order status and line-level detail
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: Order }
  /v1/orders/{id}/approve:
    post:
      summary: Human (on the side named in approval.owner) clears a held order
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [actor]
              properties:
                actor: { type: string, enum: ["human:buyer", "human:aimo"] }
      responses:
        "200": { description: Order (now confirmed) }
        "403": { description: Actor does not own this hold }
  /v1/audit/{order_id}:
    get:
      summary: Append-only, human-readable audit trace for an order
      parameters:
        - in: path
          name: order_id
          required: true
          schema: { type: string }
      responses:
        "200": { description: Audit events }
  /v1/buyers/{id}:
    get:
      summary: A buyer's own Aimo-side guardrail thresholds (credit limit, auto-approval ceiling)
      description: >
        Read-only. A buyer can only read its own profile (403 otherwise) — this
        is what a "visible permissions" UI renders instead of hardcoding the
        guardrail thresholds client-side.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: Buyer guardrail profile }
        "403": { description: Not this buyer's own profile }
        "404": { description: Unknown buyer }
